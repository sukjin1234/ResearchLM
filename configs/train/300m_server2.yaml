# ResearchLM-300M: 6B tokens, ctx 4096, 2x RTX 8000 FP16.
run_name: researchlm-300m-v1
tokenizer_path: /storage/researchlm/tokenizer/researchlm_32k.model
tokenized_dir: /storage/researchlm/tokenized/v1
checkpoint_dir: /storage/researchlm/checkpoints
log_dir: logs
mixture: {english: 0.50, korean: 0.25, code: 0.15, math: 0.10}
seq_len: 4096
micro_batch_size: 8
grad_accum_steps: 16         # 8 x 16 x 2 x 4096 = 1,048,576 tokens/step
max_steps: 6000              # 6.3B tokens
warmup_steps: 300
lr: 6.0e-4
min_lr_ratio: 0.1
scheduler: cosine
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
grad_clip: 1.0
precision: fp16
compile: true
gradient_checkpointing: true
eval_interval: 200
eval_batches: 20
log_interval: 10
save_interval: 500
keep_last_checkpoints: 4
