# ResearchLM-150M: 3B tokens (20 tok/param), 2x RTX 8000 FP16.
run_name: researchlm-150m-v1
tokenizer_path: /storage/researchlm/tokenizer/researchlm_32k.model
tokenized_dir: /storage/researchlm/tokenized/v1
checkpoint_dir: /storage/researchlm/checkpoints
log_dir: logs
mixture: {english: 0.50, korean: 0.25, code: 0.15, math: 0.10}   # replace with the 50M ablation winner
seq_len: 2048
micro_batch_size: 16
grad_accum_steps: 8          # 16 x 8 x 2 x 2048 = 524,288 tokens/step
max_steps: 6000              # 3.1B tokens
warmup_steps: 300
lr: 1.0e-3                   # from 50M sweep, scaled down ~1/sqrt(width ratio)
min_lr_ratio: 0.1
scheduler: cosine
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
grad_clip: 1.0
precision: fp16
compile: true
gradient_checkpointing: false
eval_interval: 200
eval_batches: 20
log_interval: 10
save_interval: 500
keep_last_checkpoints: 4
