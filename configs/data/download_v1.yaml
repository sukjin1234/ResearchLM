# Raw data download plan for Pretraining Dataset v1 (goal.md section 8).
# Budgets are *raw* token targets, ~1.3x the mixture target so that filtering
# and deduplication (expected 15-30% removal) still leave enough:
#   mixture target 20B = English 10B / Korean 5B / Code 3B / Math 2B
# Files are whole parquet shards downloaded with hf_hub_download (resumable).
hf_home: /storage/researchlm/hf_cache
raw_dir: /storage/researchlm/raw

domains:
  english:
    repo: HuggingFaceTB/smollm-corpus
    prefix: fineweb-edu-dedup/
    token_budget: 13.0e9          # ~0.81B GPT-2 tokens per 2.2GiB file -> ~17 files, ~38 GiB
    token_field: token_count
    text_field: text
  korean:
    repo: HuggingFaceFW/fineweb-2
    prefix: data/kor_Hang/train/
    token_budget: 6.5e9           # no token_count column: estimated from chars (2.1 chars/token), ~1.46B per file -> ~5 files, ~23 GiB
    chars_per_token: 2.1
    text_field: text
  math:
    repo: HuggingFaceTB/finemath
    prefix: finemath-4plus/
    token_budget: 2.6e9           # ~0.15B tokens per 274MiB file -> ~17 files, ~4.6 GiB
    token_field: token_count
    text_field: text
  code_meta:
    # Stack-Edu metadata only (blob ids). Actual code is fetched by
    # scripts/fetch_stack_edu.py from Software Heritage S3.
    repo: HuggingFaceTB/stack-edu
    languages: [Python, Java, C, Cpp, JavaScript, TypeScript, SQL, Shell, Go, Rust]
    all_files: true

# Per-language token targets for the code domain (sum = 3B x 1.3 = 3.9B raw).
stack_edu:
  token_budget_total: 3.9e9
  bytes_per_token: 3.3           # code tokenizes to ~3.3 bytes/token with a 32K BPE
  language_weights:
    Python: 0.30
    Java: 0.12
    C: 0.07
    Cpp: 0.10
    JavaScript: 0.12
    TypeScript: 0.06
    SQL: 0.05
    Shell: 0.05
    Go: 0.06
    Rust: 0.07
  min_int_score: 3
  license_types: [permissive]
  min_bytes: 200
  max_bytes: 200000
  workers: 64
