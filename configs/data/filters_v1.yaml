# ResearchLM Data Filter v1.
#
# Rules are evaluated top to bottom; a document is KEPT only if every rule
# holds.  "feature" refers to researchlm/data/quality.py output, or
# "meta.<column>" for dataset metadata (rule skipped when the column is absent).
# Thresholds start from Gopher / FineWeb defaults, adjusted with the sample
# statistics in goal.md section 11, then with the manual review of the full-data
# run (scripts/filter_data.py --sample-rejected).  Changes are recorded under "history".
version: v1
history:
  - 2026-10-26: initial draft from 10K-sample analysis
  - 2026-11-03: full-data review. math meta_language_score 0.60 -> 0.30 and new cjk_heavy rule; korean meta_big_dup_cluster 50 -> 200. English rules unchanged, so its draft-labelled output stays valid.

domains:
  english:
    feature_set: text
    rules:
      - {feature: n_chars,            op: ">=", value: 200,  name: too_short}
      - {feature: n_chars,            op: "<=", value: 200000, name: too_long}
      - {feature: n_words,            op: ">=", value: 50,   name: too_few_words}
      - {feature: mean_word_len,      op: ">=", value: 3.0,  name: mean_word_len_low}
      - {feature: mean_word_len,      op: "<=", value: 10.0, name: mean_word_len_high}
      - {feature: latin_ratio,        op: ">=", value: 0.60, name: latin_ratio_low}
      - {feature: alnum_ratio,        op: ">=", value: 0.70, name: alnum_ratio_low}
      - {feature: symbol_ratio,       op: "<=", value: 0.05, name: symbol_ratio_high}
      - {feature: en_stopword_frac,   op: ">=", value: 0.08, name: stopword_frac_low}
      - {feature: url_char_ratio,     op: "<=", value: 0.10, name: url_heavy}
      - {feature: html_tag_count,     op: "<=", value: 5,    name: html_tags}
      - {feature: repeated_char_ratio, op: "<=", value: 0.05, name: repeated_chars}
      - {feature: dup_line_frac,      op: "<=", value: 0.30, name: dup_lines}
      - {feature: dup_line_char_frac, op: "<=", value: 0.20, name: dup_line_chars}
      - {feature: dup_para_frac,      op: "<=", value: 0.30, name: dup_paragraphs}
      - {feature: top_2gram_frac,     op: "<=", value: 0.20, name: top_2gram}
      - {feature: top_3gram_frac,     op: "<=", value: 0.18, name: top_3gram}
      - {feature: dup_5gram_frac,     op: "<=", value: 0.30, name: dup_5gram}
      - {feature: dup_10gram_frac,    op: "<=", value: 0.20, name: dup_10gram}
      - {feature: ellipsis_line_frac, op: "<=", value: 0.30, name: ellipsis_lines}
      - {feature: bullet_line_frac,   op: "<=", value: 0.90, name: bullet_lines}
      - {feature: lorem_ipsum,        op: "==", value: 0,    name: lorem_ipsum}
      - {feature: meta.language_score, op: ">=", value: 0.65, name: meta_language_score}
      - {feature: meta.int_score,     op: ">=", value: 2,    name: meta_int_score}

  korean:
    feature_set: text
    rules:
      - {feature: n_chars,            op: ">=", value: 100,  name: too_short}        # Korean docs are short (median 694)
      - {feature: n_chars,            op: "<=", value: 150000, name: too_long}
      - {feature: hangul_ratio,       op: ">=", value: 0.35, name: hangul_ratio_low}  # sample mean 0.59; allows mixed Ko/En tech docs
      - {feature: latin_ratio,        op: "<=", value: 0.45, name: too_much_latin}
      - {feature: cjk_ratio,          op: "<=", value: 0.10, name: cjk_heavy}
      - {feature: alnum_ratio,        op: ">=", value: 0.55, name: alnum_ratio_low}
      - {feature: symbol_ratio,       op: "<=", value: 0.05, name: symbol_ratio_high}
      - {feature: ko_function_per_100chars, op: ">=", value: 1.0, name: no_korean_grammar}  # menus / keyword lists have none
      - {feature: url_char_ratio,     op: "<=", value: 0.10, name: url_heavy}
      - {feature: html_tag_count,     op: "<=", value: 5,    name: html_tags}
      - {feature: repeated_char_ratio, op: "<=", value: 0.08, name: repeated_chars}
      - {feature: dup_line_frac,      op: "<=", value: 0.30, name: dup_lines}
      - {feature: dup_line_char_frac, op: "<=", value: 0.20, name: dup_line_chars}
      - {feature: top_2gram_frac,     op: "<=", value: 0.25, name: top_2gram}
      - {feature: dup_5gram_frac,     op: "<=", value: 0.30, name: dup_5gram}
      - {feature: dup_10gram_frac,    op: "<=", value: 0.20, name: dup_10gram}
      - {feature: ellipsis_line_frac, op: "<=", value: 0.30, name: ellipsis_lines}
      - {feature: bullet_line_frac,   op: "<=", value: 0.90, name: bullet_lines}
      - {feature: meta.language_score, op: ">=", value: 0.60, name: meta_language_score}
      - {feature: meta.minhash_cluster_size, op: "<=", value: 200, name: meta_big_dup_cluster}  # above this mostly shop / terms boilerplate; 51-200 is still real articles

  math:
    feature_set: text
    rules:
      - {feature: n_chars,            op: ">=", value: 200,  name: too_short}
      - {feature: n_chars,            op: "<=", value: 200000, name: too_long}
      - {feature: n_words,            op: ">=", value: 40,   name: too_few_words}
      - {feature: alnum_ratio,        op: ">=", value: 0.45, name: alnum_ratio_low}   # LaTeX + digits lower this legitimately (sample p05 ~0.6)
      - {feature: url_char_ratio,     op: "<=", value: 0.10, name: url_heavy}
      - {feature: html_tag_count,     op: "<=", value: 10,   name: html_tags}
      - {feature: repeated_char_ratio, op: "<=", value: 0.20, name: repeated_chars}   # separators ---- and ==== are normal
      - {feature: dup_line_frac,      op: "<=", value: 0.50, name: dup_lines}         # "Solution" headers repeat legitimately
      - {feature: dup_line_char_frac, op: "<=", value: 0.35, name: dup_line_chars}
      - {feature: dup_10gram_frac,    op: "<=", value: 0.50, name: dup_10gram}       # formulas / tables repeat; Gopher 0.10 would cut a quarter of FineMath
      - {feature: lorem_ipsum,        op: "==", value: 0,    name: lorem_ipsum}
      - {feature: cjk_ratio,          op: "<=", value: 0.05, name: cjk_heavy}         # low-score Chinese posts; the language_score floor no longer catches all of them
      - {feature: meta.language_score, op: ">=", value: 0.30, name: meta_language_score}  # LaTeX lowers the score: 0.30-0.60 is mostly valid solutions
      - {feature: meta.int_score,     op: ">=", value: 4,    name: meta_int_score}    # FineMath-4+ is already >=4; keeps the rule explicit

  code:
    feature_set: code
    rules:
      - {feature: n_chars,            op: ">=", value: 200,  name: too_short}
      - {feature: n_chars,            op: "<=", value: 200000, name: too_long}
      - {feature: n_lines,            op: ">=", value: 5,    name: too_few_lines}
      - {feature: mean_line_len,      op: "<=", value: 120,  name: mean_line_len_high}   # minified / data files
      - {feature: max_line_len,       op: "<=", value: 1500, name: max_line_len_high}
      - {feature: alpha_ratio,        op: ">=", value: 0.25, name: alpha_ratio_low}      # binary-ish / numeric tables
      - {feature: alnum_ratio,        op: ">=", value: 0.35, name: alnum_ratio_low}
      - {feature: digit_ratio,        op: "<=", value: 0.35, name: digit_heavy}
      - {feature: hex_blob_count,     op: "<=", value: 3,    name: hex_blobs}
      - {feature: base64_blob_count,  op: "<=", value: 3,    name: base64_blobs}
      - {feature: autogenerated,      op: "==", value: 0,    name: autogenerated}
      - {feature: meta.int_score,     op: ">=", value: 3,    name: meta_int_score}
      - {feature: meta.license_type,  op: "in", value: [permissive], name: meta_license}
